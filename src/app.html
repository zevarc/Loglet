<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />

    <title>Loglet — make Android logcat readable</title>
    <meta
      name="description"
      content="Open-source logcat beautifier. Paste an Android logcat dump and see it become structured, filterable, searchable — all in your browser. No upload, no install." />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Loglet" />
    <meta property="og:title" content="Loglet — make Android logcat readable" />
    <meta
      property="og:description"
      content="Paste a logcat dump and see it become readable. Open-source. Runs entirely in your browser." />
    <meta property="og:image" content="%sveltekit.assets%/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Loglet — make Android logcat readable" />
    <meta
      name="twitter:description"
      content="Paste a logcat dump and see it become readable. Open-source. Runs entirely in your browser." />
    <meta name="twitter:image" content="%sveltekit.assets%/og-image.svg" />

    <!-- Don't index dev / preview deployments. The production deploy uses a
         build-time script to drop this tag — see ROADMAP D13. -->
    <!-- <meta name="robots" content="noindex" /> -->

    <!-- Set the theme attribute as early as possible to avoid a light-mode
         flash before initTheme() runs in the layout. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('loglet:theme');
          var effective;
          if (saved === 'light' || saved === 'dark') {
            effective = saved;
          } else {
            effective = matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.dataset.theme = effective;
        } catch (e) {}
      })();
    </script>

    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-bg-1 text-text-1 font-sans antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
